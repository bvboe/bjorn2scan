{{- if .Values.scanServer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bjorn2scan.fullname" . }}-{{ .Release.Namespace }}-scan-server
  labels:
    {{- include "bjorn2scan.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-server
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]
{{- if .Values.scanServer.config.hostScanning.enabled }}
# Required for host/node scanning
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- end }}
# Required for console URL detection in metrics
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
# NOTE: the broad write permissions the update controller needs for `helm upgrade`
# (secrets, clusterrole(binding)s, workloads, etc.) are deliberately NOT granted here.
# They live on a separate, short-lived CronJob ServiceAccount — see
# templates/update-controller-rbac.yaml — so the long-running scan-server and
# pod-scanner never carry that privilege-escalation surface.
{{- end }}
