{{- if .Values.scanServer.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "bjorn2scan.fullname" . }}-{{ .Release.Namespace }}-scan-server
  labels:
    {{- include "bjorn2scan.labels" . | nindent 4 }}
    app.kubernetes.io/component: scan-server
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods/status"]
  verbs: ["get"]
{{- if .Values.scanServer.config.hostScanning.enabled }}
# Required for host/node scanning
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
{{- end }}
# Required for console URL detection in metrics
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get"]
{{- if .Values.updateController.enabled }}
# TRANSITION — remove this block in a follow-up release (see TODO.md "two-step
# update-controller RBAC migration"). These broad helm-upgrade permissions are also
# granted to the dedicated update-controller ServiceAccount
# (templates/update-controller-rbac.yaml), which the CronJob now uses. They are kept
# on the scan-server SA *temporarily* so the FIRST auto-update from a pre-scoping
# release — run by the old controller as THIS SA — does not strip its own permissions
# mid-`helm upgrade` and fail. A later release deletes this block, leaving the
# scan-server SA read-only (the real end state).
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["services", "serviceaccounts", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
{{- end }}
