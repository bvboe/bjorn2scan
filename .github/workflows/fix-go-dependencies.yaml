name: Fix Go Dependencies

on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'

permissions:
  contents: write

jobs:
  tidy:
    # Only run on dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          # Need a token with write access to push commits
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: scanner-core/go.mod

      - name: Run go mod tidy in all modules
        env:
          # setup-go sets GOTOOLCHAIN=local, which makes a `go` directive above
          # the installed toolchain a hard failure instead of a download:
          #
          #   go: go.mod requires go >= 1.27.0 (running go 1.26.10; GOTOOLCHAIN=local)
          #
          # The toolchain above comes from scanner-core/go.mod, but this step
          # tidies five modules. A Dependabot PR that raises the directive in any
          # other module - which is routine, a dependency only has to require a
          # newer Go - therefore breaks the run. That happened twice on
          # 2026-11-02, when sigstore-go 1.4.0 pulled bjorn2scan-agent and
          # k8s-update-controller to 1.27.0 while scanner-core stayed on 1.26.10.
          #
          # This workflow exists to repair go.mod in Dependabot PRs, so it was
          # disabled by exactly the case it is meant to handle. Pinning cannot
          # fix that: the required version is whatever the PR just made it, which
          # is unknowable when the toolchain is selected. GOTOOLCHAIN=auto lets Go
          # fetch what each module asks for; downloads are checksum-verified
          # through sum.golang.org.
          #
          # Deliberately scoped to this step. Everywhere else the pinned
          # go-version-file is correct and must stay - those workflows run `go`
          # only in the module that supplies their toolchain.
          GOTOOLCHAIN: auto
        run: |
          for dir in scanner-core bjorn2scan-agent k8s-scan-server k8s-update-controller pod-scanner; do
            echo "=== Tidying $dir (go $(awk '/^go /{print $2; exit}' $dir/go.mod)) ==="
            (cd $dir && go mod tidy)
          done

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: go mod tidy across all modules

          Auto-generated by fix-go-dependencies workflow"
          git push
