name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.4.5)'
        required: true
        type: string
      chart_version:
        description: 'Chart version (e.g., 0.4.5) - leave empty to use same as version'
        required: false
        type: string

jobs:
  test:
    uses: ./.github/workflows/integration-test.yml
    with:
      version: ${{ inputs.version }}
      scan_wait_time: 180

  release:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set versions
        id: versions
        run: |
          echo "APP_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          if [ -z "${{ inputs.chart_version }}" ]; then
            echo "CHART_VERSION=${{ inputs.version }}" >> $GITHUB_ENV
          else
            echo "CHART_VERSION=${{ inputs.chart_version }}" >> $GITHUB_ENV
          fi
          echo "app_version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          if [ -z "${{ inputs.chart_version }}" ]; then
            echo "chart_version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "chart_version=${{ inputs.chart_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push pod-scanner
        uses: docker/build-push-action@v5
        with:
          context: ./pod-scanner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          tags: bjornvb/k8s-pod-scanner:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push vulnerability-coordinator
        uses: docker/build-push-action@v5
        with:
          context: ./vulnerability-coordinator
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          tags: bjornvb/k8s-scanner-vulnerability-coordinator:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web-frontend
        uses: docker/build-push-action@v5
        with:
          context: ./web-frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          tags: bjornvb/k8s-scanner-web-frontend:${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update Helm chart version
        run: |
          yq eval ".appVersion=\"${{ env.APP_VERSION }}\" | .version=\"${{ env.CHART_VERSION }}\"" \
                   bjorn2scan/Chart.yaml > bjorn2scan/newChart.yaml
          mv bjorn2scan/newChart.yaml bjorn2scan/Chart.yaml

      - name: Package and push Helm chart
        run: |
          helm package bjorn2scan
          helm push bjorn2scan-${{ env.CHART_VERSION }}.tgz oci://registry-1.docker.io/bjornvb

      - name: Commit version updates
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add bjorn2scan/Chart.yaml
          git commit -m "Release version ${{ env.APP_VERSION }}" || echo "No changes to commit"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          body: |
            ## Bjørn2Scan v${{ env.APP_VERSION }}

            ### Docker Images
            - `bjornvb/k8s-pod-scanner:${{ env.APP_VERSION }}`
            - `bjornvb/k8s-scanner-vulnerability-coordinator:${{ env.APP_VERSION }}`
            - `bjornvb/k8s-scanner-web-frontend:${{ env.APP_VERSION }}`

            ### Helm Chart
            - `oci://registry-1.docker.io/bjornvb/bjorn2scan:${{ env.CHART_VERSION }}`

            ### Installation
            ```bash
            helm upgrade --install bjorn2scan oci://registry-1.docker.io/bjornvb/bjorn2scan --version ${{ env.CHART_VERSION }} --set clusterName="My Cluster" --wait
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        run: |
          echo "## Release Complete! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version:** ${{ env.APP_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Chart Version:** ${{ env.CHART_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Integration Tests:** :white_check_mark: Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images" >> $GITHUB_STEP_SUMMARY
          echo "- \`bjornvb/k8s-pod-scanner:${{ env.APP_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`bjornvb/k8s-scanner-vulnerability-coordinator:${{ env.APP_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`bjornvb/k8s-scanner-web-frontend:${{ env.APP_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm Chart" >> $GITHUB_STEP_SUMMARY
          echo "- \`oci://registry-1.docker.io/bjornvb/bjorn2scan:${{ env.CHART_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
