name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - pod-scanner
          - vulnerability-coordinator
          - web-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.component }} image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci-build
          tags: bjornvb/k8s-${{ matrix.component }}:ci-build
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-helm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Lint Helm chart
        run: helm lint bjorn2scan

      - name: Template Helm chart
        run: helm template test-release bjorn2scan --set clusterName="Test Cluster"

  integration-test:
    needs: [build-and-test, lint-helm]
    uses: ./.github/workflows/integration-test.yml
    with:
      version: ci-test
      scan_wait_time: 180
