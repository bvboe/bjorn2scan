name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'scanner-core/web/**'
      - 'dev-local/**'
      - '**.md'
      - 'scripts/grype-db-history.json'
      - '.github/workflows/agent-integration-test.yaml'
      - '.github/workflows/auto-update-test.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/update-grype-db-history.yaml'
      - '.github/workflows/web-lint.yaml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'scanner-core/web/**'
      - 'dev-local/**'
      - '**.md'
      - 'scripts/grype-db-history.json'
      - '.github/workflows/agent-integration-test.yaml'
      - '.github/workflows/auto-update-test.yaml'
      - '.github/workflows/release.yaml'
      - '.github/workflows/update-grype-db-history.yaml'
      - '.github/workflows/web-lint.yaml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  # sbom-generator-shared library (lightweight dependency for pod-scanner and bjorn2scan-agent)
  sbom-generator-shared:
    name: sbom-generator-shared
    uses: ./.github/workflows/go-library-reusable.yaml
    with:
      component-name: sbom-generator-shared
      component-path: sbom-generator-shared
      run-tests: true
      run-lint: true

  # scanner-core library (dependency for other components)
  scanner-core:
    name: scanner-core
    uses: ./.github/workflows/go-library-reusable.yaml
    with:
      component-name: scanner-core
      component-path: scanner-core
      run-tests: true
      run-lint: true

  integration-tests:
    name: Integration Tests
    needs: [scanner-core]
    uses: ./.github/workflows/integration-test.yaml

  # k8s-scan-server component
  k8s-scan-server:
    name: k8s-scan-server
    needs: [scanner-core]
    uses: ./.github/workflows/go-component-reusable.yaml
    with:
      component-name: k8s-scan-server
      component-path: k8s-scan-server
      image-name: k8s-scan-server
      run-tests: true
      run-lint: true
      run-build: true
      run-docker: true
      docker-push: false
      image-tag: test

  # k8s-update-controller component
  k8s-update-controller:
    name: k8s-update-controller
    needs: [scanner-core]
    uses: ./.github/workflows/go-component-reusable.yaml
    with:
      component-name: k8s-update-controller
      component-path: k8s-update-controller
      image-name: k8s-update-controller
      run-tests: true
      run-lint: true
      run-build: true
      run-docker: true
      docker-push: false
      image-tag: test

  # pod-scanner component (depends on sbom-generator-shared)
  pod-scanner:
    name: pod-scanner
    needs: [sbom-generator-shared]
    uses: ./.github/workflows/go-component-reusable.yaml
    with:
      component-name: pod-scanner
      component-path: pod-scanner
      image-name: pod-scanner
      run-tests: true
      run-lint: true
      run-build: true
      run-docker: true
      docker-push: false
      image-tag: test

  # bjorn2scan-agent component (binary build)
  bjorn2scan-agent:
    name: bjorn2scan-agent
    needs: [scanner-core, sbom-generator-shared]
    uses: ./.github/workflows/go-binary-reusable.yaml
    with:
      component-name: bjorn2scan-agent
      component-path: bjorn2scan-agent
      run-tests: true
      run-lint: true
      platforms: linux/amd64,linux/arm64

  # Web linting lives in web-lint.yaml. It cannot run here: this workflow
  # ignores scanner-core/web/**, and path filters apply per workflow rather than
  # per job, so a web-only change skipped the very job meant to lint it.

  helm-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Helm
      uses: azure/setup-helm@v5
      with:
        version: 'latest'

    - name: Lint Helm chart
      run: helm lint helm/bjorn2scan

    - name: Template Helm chart
      run: helm template test helm/bjorn2scan --debug

    - name: Validate RBAC Permissions in ClusterRole
      run: ./scripts/test-helm-rbac-template

    # Catches settings that exist in the chart or agent.conf.example but that the
    # code never reads, which otherwise fail silently: the option appears
    # supported, is accepted without complaint, and does nothing. Six of these had
    # accumulated before the check existed, including a Helm value whose metric
    # toggle had been inert since the metric was renamed.
    - name: Check config consistency across chart, agent config and code
      run: ./scripts/check-config-consistency
