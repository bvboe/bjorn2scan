name: Integration Test

on:
  workflow_call:
    inputs:
      version:
        description: 'Version tag for images'
        required: false
        type: string
        default: 'ci-test'
      scan_wait_time:
        description: 'Maximum time to wait for scans (seconds)'
        required: false
        type: number
        default: 180

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: test-cluster
          wait: 300s

      - name: Build pod-scanner image
        uses: docker/build-push-action@v7
        with:
          context: ./pod-scanner
          load: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: pod-scanner:${{ inputs.version }}
          cache-from: type=gha

      - name: Build vulnerability-coordinator image
        uses: docker/build-push-action@v7
        with:
          context: ./vulnerability-coordinator
          load: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: vulnerability-coordinator:${{ inputs.version }}
          cache-from: type=gha

      - name: Build web-frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./web-frontend
          load: true
          build-args: |
            VERSION=${{ inputs.version }}
          tags: web-frontend:${{ inputs.version }}
          cache-from: type=gha

      - name: Load images into kind
        run: |
          kind load docker-image pod-scanner:${{ inputs.version }} --name test-cluster
          kind load docker-image vulnerability-coordinator:${{ inputs.version }} --name test-cluster
          kind load docker-image web-frontend:${{ inputs.version }} --name test-cluster

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Install bjorn2scan
        run: |
          helm install bjorn2scan ./bjorn2scan \
            --set clusterName="Test Cluster" \
            --set podScanner.image.repository=pod-scanner \
            --set podScanner.image.tag=${{ inputs.version }} \
            --set podScanner.image.pullPolicy=Never \
            --set vulnerabilityCoordinator.image.repository=vulnerability-coordinator \
            --set vulnerabilityCoordinator.image.tag=${{ inputs.version }} \
            --set vulnerabilityCoordinator.image.pullPolicy=Never \
            --set webFrontend.image.repository=web-frontend \
            --set webFrontend.image.tag=${{ inputs.version }} \
            --set webFrontend.image.pullPolicy=Never \
            --wait \
            --timeout 5m

      - name: Wait for pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=pod-scanner --timeout=300s
          kubectl wait --for=condition=ready pod -l app=vulnerability-coordinator --timeout=300s
          kubectl wait --for=condition=ready pod -l app=web-frontend --timeout=300s

      - name: Run integration tests
        run: ./integration-test/run-test
        env:
          NAMESPACE: default
          RELEASE_NAME: bjorn2scan
          SCAN_WAIT_TIME: ${{ inputs.scan_wait_time }}

      - name: Show pod logs on failure
        if: failure()
        run: |
          echo "=== Pod Scanner Logs ==="
          kubectl logs -l app=pod-scanner --tail=100 || true
          echo "=== Vulnerability Coordinator Logs ==="
          kubectl logs -l app=vulnerability-coordinator --tail=100 || true
          echo "=== Web Frontend Logs ==="
          kubectl logs -l app=web-frontend --tail=100 || true
          echo "=== Kubernetes Events ==="
          kubectl get events --sort-by='.lastTimestamp' || true
